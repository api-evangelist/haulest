description: Haulest, operated by Panaweb LLC (Dover, Delaware), publishes moving-cost
  ranges, route facts, reviewed movers, mover licence checks, moving guides and checklists
  for the US, Canada and the UK, and exposes them to AI assistants through a no-auth
  remote MCP server at https://haulest.com/mcp with eight tools including estimate_moving_cost,
  find_movers and request_moving_quotes. Haulest is not a carrier and does not operate
  trucks.
